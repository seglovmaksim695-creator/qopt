[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qopt"
version = "0.2.0"
description = "Verified Clifford+T circuit optimizer: lower T and CX counts, unitary and measurement-based models, independent verification"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Maksym Shchehlov" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "qiskit>=2.0",
    "pyzx>=0.10",
    "torch>=2.4",
]
keywords = ["quantum computing", "circuit optimization", "Clifford+T", "T-count", "CNOT count", "verification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qopt = "qopt.qopt_core:main"

[tool.setuptools.packages.find]
include = ["qopt*"]

[tool.setuptools.package-data]
qopt = ["models/*.pt", "contrib/c1/best_clean/*.qasm", "contrib/c1/best_clean/*.json", "contrib/eng1/ours/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
