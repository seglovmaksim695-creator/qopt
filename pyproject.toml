[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Project name: qopt. Distribution and import package: qoptct (the PyPI name "qopt" belongs to an unrelated project).
name = "qoptct"
version = "0.3.0"
description = "qopt: verified Clifford+T circuit optimizer (T and CNOT counts) with a Qiskit transpiler plugin"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Maksym Shchehlov" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "qiskit>=2.0",
    "pyzx>=0.10",
]
keywords = ["quantum computing", "circuit optimization", "Clifford+T", "T-count", "CNOT count", "verification", "qiskit", "transpiler plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/seglovmaksim695-creator/qopt"
Repository = "https://github.com/seglovmaksim695-creator/qopt"
Issues = "https://github.com/seglovmaksim695-creator/qopt/issues"
Changelog = "https://github.com/seglovmaksim695-creator/qopt/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.24182059"

[project.optional-dependencies]
net = ["torch>=2.4"]
test = ["pytest>=8"]

[project.scripts]
qoptct = "qoptct.qopt_core:main"

[project.entry-points."qiskit.transpiler.optimization"]
qoptct = "qoptct.qiskit_qopt:QoptOptimizationPlugin"

[project.entry-points."qiskit.transpiler.init"]
qoptct = "qoptct.qiskit_qopt:QoptInitPlugin"

[tool.setuptools.packages.find]
include = ["qoptct*"]

[tool.setuptools.package-data]
qoptct = ["models/*.pt", "contrib/c1/best_clean/*.qasm", "contrib/c1/best_clean/*.json", "contrib/eng1/ours/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
